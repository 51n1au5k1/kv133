################################################################################
# /packages/helper_climate_common.yaml
################################################################################
#
# ОБЩАЯ ИНФРАСТРУКТУРА КЛИМАТИЧЕСКОЙ СИСТЕМЫ
#
# Пакет содержит только общие и постоянно используемые механизмы:
# 1. Усреднённые датчики гостиной.
# 2. CO₂ и необходимость проветривания.
# 3. Зимний режим.
# 4. Сохранение/восстановление режима кондиционера.
# 5. Отключение кондиционера при открытии балконных дверей.
#
# Логика снятых с эксплуатации или временно отсутствующих устройств хранится
# вне /packages в /archive/devices и Home Assistant не загружается.
################################################################################

################################################################################
# БИНАРНЫЕ И ШАБЛОННЫЕ СЕНСОРЫ
################################################################################

template:
  - binary_sensor:
      - unique_id: temperature_below_20
        name: "Температура ниже 20°C"
        device_class: cold
        state: >
          {% set temp1 = states('sensor.temperatura_v_gostinoi_sglazhennaia') %}
          {% set temp2 = states('sensor.temperatura_v_spalne_sglazhennaia') %}
          {% set temp3 = states('sensor.srednee_znachenie_temperatury_v_masterskoi_2') %}
          {{ (temp1 not in ['unknown','unavailable'] and temp1|float <= 20)
             or (temp2 not in ['unknown','unavailable'] and temp2|float <= 20)
             or (temp3 not in ['unknown','unavailable'] and temp3|float <= 20) }}

      - unique_id: livingroom_ventilation_need
        name: "Необходимость проветривания"
        device_class: problem
        availability: >
          {{ states('sensor.uroven_co2_sglazhennyi') not in ['unknown','unavailable',''] }}
        state: >
          {% set co2    = states('sensor.uroven_co2_sglazhennyi') | float(0) %}
          {% set high   = states('input_number.co2_threshold_high') | float(0) %}
          {% set low    = states('input_number.co2_threshold_low')  | float(0) %}
          {% set was_on = is_state('binary_sensor.livingroom_ventilation_need','on') %}
          {{ (co2 > low) if was_on else (co2 > high) }}

      - unique_id: livingroom_ventilation_status
        name: "Статус проветривания"
        availability: >
          {{ states('sensor.uroven_co2_sglazhennyi') not in ['unknown','unavailable',''] }}
        state: >
          {% set co2 = states('sensor.uroven_co2_sglazhennyi') | float(0) %}
          {% set low = states('input_number.co2_threshold_low') | float(0) %}
          {{ co2 < low }}

  - sensor:
      - name: "Норма атмосферного давления"
        unique_id: fixed_pressure_value
        unit_of_measurement: "mmHg"
        state: "739"

      - name: "Living Room Average Temperature"
        unique_id: livingroom_average_temperature
        unit_of_measurement: "°C"
        icon: "mdi:thermometer"
        availability: >-
          {{ states('sensor.livingroom_climat_sensor_temperature') not in ['unknown','unavailable','']
             or states('sensor.gostinaia_stantsiia_mini_3_pro_temperatura') not in ['unknown','unavailable',''] }}
        state: >-
          {% set t1 = states('sensor.livingroom_climat_sensor_temperature') | float(none) %}
          {% set t2 = states('sensor.gostinaia_stantsiia_mini_3_pro_temperatura') | float(none) %}
          {% set vals = [t1, t2] | reject('equalto', none) | list %}
          {% if vals | length > 0 %}
            {{ (vals | sum / (vals | length)) | round(1) }}
          {% else %}
            unknown
          {% endif %}

      - name: "Living Room Average Humidity"
        unique_id: livingroom_average_humidity
        unit_of_measurement: "%"
        icon: "mdi:water-percent"
        availability: >-
          {{ states('sensor.livingroom_climat_sensor_humidity') not in ['unknown','unavailable','']
             or states('sensor.gostinaia_stantsiia_mini_3_pro_vlazhnost') not in ['unknown','unavailable',''] }}
        state: >-
          {% set h1 = states('sensor.livingroom_climat_sensor_humidity') | float(none) %}
          {% set h2 = states('sensor.gostinaia_stantsiia_mini_3_pro_vlazhnost') | float(none) %}
          {% set vals = [h1, h2] | reject('equalto', none) | list %}
          {% if vals | length > 0 %}
            {{ (vals | sum / (vals | length)) | round(1) }}
          {% else %}
            unknown
          {% endif %}

      - name: "Скорректированное атмосферное давление"
        unique_id: livingroom_corrected_pressure
        unit_of_measurement: "мм рт.ст."
        icon: "mdi:gauge"
        availability: >-
          {{ states('sensor.livingroom_climat_sensor_pressure') not in ['unknown','unavailable',''] }}
        state: >-
          {% set raw_pressure = states('sensor.livingroom_climat_sensor_pressure') | float(0) %}
          {% set correction = states('input_number.pressure_correction_value') | float(6) %}
          {% if raw_pressure > 0 %}
            {{ (raw_pressure + correction) | round(1) }}
          {% else %}
            0
          {% endif %}

sensor:
  - platform: filter
    name: "Уровень CO2 (сглаженный)"
    entity_id: sensor.gostinaia_stantsiia_mini_3_pro_uroven_uglekislogo_gaza
    filters:
      - filter: time_simple_moving_average
        window_size: "00:02"
        precision: 0

  - platform: filter
    name: "Температура в гостиной (сглаженная)"
    entity_id: sensor.livingroom_average_temperature
    filters:
      - filter: time_simple_moving_average
        window_size: "00:02"
        precision: 2

################################################################################
# ВХОДНЫЕ ПАРАМЕТРЫ
################################################################################

input_boolean:
  winter_mode:
    name: "Зимний режим"
    initial: false
    icon: mdi:snowflake

  door_open_climate_pre_state:
    name: "Climate Pre-State When Door Opened"
    initial: false

input_text:
  climate_pre_restart_hvac_mode:
    name: "Кондиционер: HVAC-режим перед перезапуском"
    max: 20

input_number:
  low_th_notification_reset_period:
    name: "Период сброса уведомлений о низкой температуре"
    min: 5
    max: 60
    step: 1
    initial: 20

  pressure_correction_value:
    name: "Поправка давления (мм рт.ст.)"
    min: 0
    max: 20
    step: 0.5
    unit_of_measurement: "мм рт.ст."
    initial: 6

  co2_threshold_high:
    name: "Порог CO2 для проветривания (жёсткий)"
    min: 400
    max: 2000
    step: 50
    initial: 1000

  co2_threshold_low:
    name: "Порог CO2 для завершения проветривания (мягкий)"
    min: 300
    max: 1500
    step: 50
    initial: 550

################################################################################
# АВТОМАТИЗАЦИИ
################################################################################

automation:
  - id: "d8084e61-405b-4f92-8c86-527254cc6753"
    alias: "HELPER: Переключение зимнего режима по месяцам"
    mode: single
    triggers:
      - trigger: time
        at: "00:01:00"
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ now().month >= 11 or now().month <= 3 }}
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.winter_mode
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.winter_mode

  - id: "5b187cde-0ad5-4132-bb68-a622dd15d6ff"
    alias: "HELPER: Сохранение состояния кондиционера"
    mode: single
    triggers:
      - trigger: homeassistant
        event: shutdown
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.climate_pre_restart_hvac_mode
        data:
          value: >-
            {% set mode = states('climate.konditsioner') %}
            {{ mode if mode in ['heat', 'dry', 'cool', 'fan_only', 'heat_cool'] else 'off' }}

  - id: "457a6711-67fa-4cb2-bcab-63c0cc58e054"
    alias: "HELPER: Восстановление состояния кондиционера"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:10"

      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('input_text.climate_pre_restart_hvac_mode')
                     in ['heat', 'dry', 'cool', 'fan_only', 'heat_cool'] }}
              - condition: template
                value_template: "{{ 4 <= now().month <= 10 }}"
              - condition: state
                entity_id: binary_sensor.doors_in_kitchen_livingroom
                state: "off"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.konditsioner
                data:
                  hvac_mode: "{{ states('input_text.climate_pre_restart_hvac_mode') }}"

      - action: input_text.set_value
        target:
          entity_id: input_text.climate_pre_restart_hvac_mode
        data:
          value: "off"

  - id: "f4e42442-155e-4d0a-87c2-3f21fd72025d"
    alias: "HELPER: Гостиная: отключить кондиционер при открытии двери"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.doors_in_kitchen_livingroom
        to: "on"
        for: "00:01:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.door_open_climate_pre_state

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not is_state('climate.konditsioner', 'off') }}"
              - condition: state
                entity_id: input_boolean.winter_mode
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.door_open_climate_pre_state
              - action: climate.turn_off
                target:
                  entity_id: climate.konditsioner

  - id: "0347cae6-1b2f-436a-a54c-792feafa9620"
    alias: "HELPER: Гостиная: восстановить кондиционер после закрытия двери"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.doors_in_kitchen_livingroom
        to: "off"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.door_open_climate_pre_state
                state: "on"
              - condition: state
                entity_id: input_boolean.winter_mode
                state: "off"
            sequence:
              - action: climate.turn_on
                target:
                  entity_id: climate.konditsioner

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.door_open_climate_pre_state

  - id: "b9867c28-be9f-425e-9fee-0aea777d04c0"
    alias: "HELPER: Защита — не включать кондиционер при активном зимнем режиме"
    mode: single
    triggers:
      - trigger: state
        entity_id: climate.konditsioner
        from: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.winter_mode
        state: "on"
    actions:
      - action: climate.turn_off
        target:
          entity_id: climate.konditsioner
      - action: notify.send_message
        target:
          entity_id: notify.telegram_master
        data:
          message: "Кондиционер принудительно отключён: активен зимний режим."
      - action: script.yandex_tts_kondicioner_warning
