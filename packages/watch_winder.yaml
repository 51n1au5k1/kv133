################################################################################
# /packages/watch_winder.yaml
################################################################################
#
# АВТОМАТИЧЕСКИЙ ЗАВОДЧИК МЕХАНИЧЕСКИХ ЧАСОВ
#
# ЧАСЫ:
# • HVILINA Star Chronicle — Miyota 9100
# • Orient ET0T / Sun & Moon — Orient 46B40
#
# РЕЖИМ:
# • оба экземпляра находятся на одной вращающейся площадке
# • физическое направление вращения — вправо
# • на текущей разводке ESPHome-направление reverse соответствует вращению вправо
# • скорость двигателя — 100%
# • 7 дневных блоков с интервалом 2 часа 30 минут
# • каждый блок: 5 минут вращения, 15 минут покоя, 5 минут вращения
# • всего 14 циклов по 300 секунд
# • измеренная скорость площадки — около 9,8 об/мин при 100%
# • один цикл — около 49 оборотов
# • расчётная суточная нагрузка — около 686 оборотов
# • ночной покой — примерно с 21:25 до 06:00
#
# ЗАВИСИМОСТИ:
# • number.a5in_watch_winder_dlitelnost_vrashcheniia
# • number.a5in_watch_winder_skorost_motora
# • fan.a5in_watch_winder_motor_zavodchika
# • button.a5in_watch_winder_zapustit_tsikl
#
# ВАЖНО:
# В прошивке ESPHome сценарий run_rotation_cycle также должен запускать
# двигатель с direction: reverse. Иначе кнопка «Запустить цикл» перезапишет
# направление обратно на forward, что на текущей разводке означает вращение
# против часовой стрелки.
#
################################################################################

automation:
  - id: "78d11ce9-448e-4817-ac56-fd6474f40ca3"
    alias: "Заводчик часов — HVILINA и Orient — Gentle 686 TPD"
    description: >-
      Семь дневных блоков. Каждый блок состоит из двух циклов
      по 300 секунд с 15 минутами покоя между ними.
      Физическое направление — вправо; на текущей разводке ему
      соответствует ESPHome-направление reverse. Скорость — 100%.
      Расчётная нагрузка при скорости 9,8 об/мин составляет
      около 686 оборотов в сутки.
    mode: single
    triggers:
      - trigger: time
        at:
          - "06:00:00"
          - "08:30:00"
          - "11:00:00"
          - "13:30:00"
          - "16:00:00"
          - "18:30:00"
          - "21:00:00"

    conditions: []

    actions:
      # Продолжительность одного цикла — 300 секунд.
      - action: number.set_value
        target:
          entity_id: number.a5in_watch_winder_dlitelnost_vrashcheniia
        data:
          value: 300

      # Расчёт 686 TPD выполнен для полной скорости.
      - action: number.set_value
        target:
          entity_id: number.a5in_watch_winder_skorost_motora
        data:
          value: 100

      # На текущей разводке reverse физически вращает площадку вправо.
      - action: fan.set_direction
        target:
          entity_id: fan.a5in_watch_winder_motor_zavodchika
        data:
          direction: reverse

      # Даём ESPHome время принять настройки.
      - delay: "00:00:01"

      # Первый пятиминутный цикл.
      - action: button.press
        target:
          entity_id: button.a5in_watch_winder_zapustit_tsikl

      # 5 минут вращения + 15 минут покоя.
      - delay: "00:20:00"

      # Второй пятиминутный цикл.
      - action: button.press
        target:
          entity_id: button.a5in_watch_winder_zapustit_tsikl

      # Ждём завершения второго цикла.
      - delay: "00:05:05"
