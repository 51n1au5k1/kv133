# Board: DOIT ESP32 DEVKIT V1 (DOIT)
# Рабочая прошивка A5IN LED Block v1.1
#
# Аппаратный контракт:
# - WS2812B DIN       <- 330 Ом <- ESP32 D18 / GPIO18
# - TTP223 I/O        -> ESP32 D27 / GPIO27
# - MAX9814 Output    -> ESP32 VP / GPIO36
# - MAX9814 VDD       -> ESP32 3V3
# - MAX9814 Gain, AR  -> не подключать
# - ESP32 VIN и матрица +5V питаются параллельно от БП 5V 3A
# - GND всех узлов объединены

esphome:
  name: a5in-led-block
  friendly_name: a5in-led-block
  comment: "Рабочая лампа v1.1: правильная ориентация, свеча и прямой выбор эффектов"

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

preferences:
  flash_write_interval: 1min

logger:
  level: INFO

api:
  encryption:
    key: "156Ci5/iHQGSqI1tj4H2Z/nOsrRgqE2sDpqFpWcr1to="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "led-block Fallback Hotspot"
    password: "jzKOJdWDbugW"

captive_portal:

web_server:
  port: 80
  version: 3

# ============================================================
# Сохраняемый индекс ступени яркости для длительного касания.
#
# 0 = 5%
# 1 = 10%
# 2 = 20%
# 3 = 40%
# 4 = 70%
# 5 = 100%
#
# Физический предел потребления задаётся color_correct: 14%,
# поэтому даже 100% яркости в HA остаётся безопасным режимом
# для блока питания 5V 3A.
# ============================================================

globals:
  - id: brightness_step_index
    type: int
    restore_value: true
    update_interval: 10s
    initial_value: "2"

# ============================================================
# Настройки эффектов и микрофона.
# Все значения сохраняются во flash.
# ============================================================

number:
  - platform: template
    id: effect_speed
    name: "Скорость эффектов [FX_SPEED]"
    icon: "mdi:speedometer"
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 45
    restore_value: true
    optimistic: true

  - platform: template
    id: effect_scale
    name: "Масштаб эффектов [FX_SCALE]"
    icon: "mdi:resize"
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 50
    restore_value: true
    optimistic: true

  - platform: template
    id: microphone_sensitivity
    name: "Чувствительность микрофона [MIC_SENS]"
    icon: "mdi:microphone-settings"
    entity_category: config
    min_value: 0.5
    max_value: 12.0
    step: 0.1
    initial_value: 3.0
    restore_value: true
    optimistic: true

  - platform: template
    id: microphone_noise_floor
    name: "Шумовой порог микрофона [MIC_FLOOR]"
    icon: "mdi:waveform"
    entity_category: config
    unit_of_measurement: "V"
    min_value: 0.0
    max_value: 1.5
    step: 0.01
    initial_value: 0.45
    restore_value: true
    optimistic: true

  - platform: template
    id: microphone_smoothing
    name: "Сглаживание цветомузыки [MIC_SMOOTH]"
    icon: "mdi:chart-bell-curve"
    entity_category: config
    min_value: 0.0
    max_value: 0.95
    step: 0.05
    initial_value: 0.70
    restore_value: true
    optimistic: true


# ============================================================
# Прямой выбор эффекта.
#
# Сущность появится в Home Assistant как обычный select.
# Выбранный пункт сразу включает лампу и запускает нужный эффект.
# Состояние select сохраняется.
# ============================================================

select:
  - platform: template
    id: effect_selector
    name: "Эффект лампы [EFFECT]"
    icon: "mdi:animation-play"
    optimistic: true
    restore_value: true
    initial_option: "Огонь 2D"

    options:
      - "Радуга"
      - "Светлячки"
      - "Фейерверк"
      - "Свеча"
      - "Огонь 2D"
      - "Цифровой дождь"
      - "Плазма"
      - "Цветомузыка — пульс"
      - "Цветомузыка — VU"
      - "Цветомузыка — центр"

    set_action:
      - lambda: |-
          auto call = id(matrix).turn_on();
          call.set_effect(x);
          call.perform();

# ============================================================
# Конфигурационные переключатели.
#
# SWAP_XY включён по умолчанию, потому что фактическая матрица
# разведена колонками: без транспонирования изображение лежит
# на боку, а логический низ отображается слева.
#
# Flip X / Flip Y позволяют дополнительно отразить изображение.
# Serpentine должен оставаться включённым для данной матрицы.
# ============================================================

switch:
  - platform: template
    id: sound_overlay_enabled
    name: "Реакция обычных эффектов на звук [SOUND_OVERLAY]"
    icon: "mdi:music-note-plus"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON


  - platform: template
    id: matrix_swap_xy
    name: "Ориентация матрицы — поменять X/Y [SWAP_XY]"
    icon: "mdi:rotate-90-degrees-clockwise"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: matrix_flip_x
    name: "Ориентация матрицы — отражение X [FLIP_X]"
    icon: "mdi:flip-horizontal"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: matrix_flip_y
    name: "Ориентация матрицы — отражение Y [FLIP_Y]"
    icon: "mdi:flip-vertical"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: matrix_serpentine
    name: "Разводка матрицы — змейка [SERPENTINE]"
    icon: "mdi:swap-horizontal-bold"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# ============================================================
# MAX9814
#
# Текущий анализатор v1 измеряет амплитуду сигнала:
# - пик напряжения;
# - условный уровень выше смещения 1,23V;
# - нормированный уровень 0..100%.
#
# Это уже даёт рабочую цветомузыку по громкости. Настоящий FFT
# с частотными полосами будет отдельным следующим обновлением.
# ============================================================

sensor:
  - platform: adc
    id: microphone_peak_voltage
    name: "Микрофон — пиковое напряжение [MIC_PEAK]"
    icon: "mdi:sine-wave"
    pin: GPIO36
    attenuation: 12db
    samples: 255
    sampling_mode: max
    update_interval: 100ms
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    force_update: true

  - platform: copy
    source_id: microphone_peak_voltage
    id: microphone_level
    name: "Микрофон — уровень выше смещения [MIC_LEVEL]"
    icon: "mdi:waveform"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    state_class: measurement
    force_update: true
    filters:
      - lambda: |-
          const float microphone_bias = 1.23f;
          const float level = x - microphone_bias;
          return level > 0.0f ? level : 0.0f;

  - platform: template
    id: microphone_normalized
    name: "Микрофон — нормированный уровень [MIC_NORMALIZED]"
    icon: "mdi:signal"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 100ms
    lambda: |-
      const float level = id(microphone_level).state;

      if (isnan(level)) {
        return NAN;
      }

      float normalized =
          (level - id(microphone_noise_floor).state) *
          id(microphone_sensitivity).state;

      if (normalized < 0.0f) {
        normalized = 0.0f;
      } else if (normalized > 1.0f) {
        normalized = 1.0f;
      }

      return normalized * 100.0f;

  - platform: wifi_signal
    id: wifi_signal_db
    name: "Уровень Wi-Fi [WIFI_DB]"
    icon: "mdi:wifi"
    update_interval: 30s
    entity_category: diagnostic

  - platform: uptime
    id: device_uptime
    name: "Время работы [UPTIME]"
    icon: "mdi:timer-outline"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    id: touch_button
    name: "Сенсорная кнопка [TOUCH]"
    icon: "mdi:gesture-tap-button"
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: false
        pulldown: false
      inverted: false

    filters:
      - delayed_on_off: 20ms

    # Двойное касание: следующий эффект.
    # Длинное касание: следующая ступень яркости.
    # Короткое касание: включение/выключение.
    on_multi_click:
      - timing:
          - ON for 40ms to 500ms
          - OFF for 40ms to 400ms
          - ON for 40ms to 500ms
          - OFF for at least 250ms
        invalid_cooldown: 500ms
        then:
          - select.next:
              id: effect_selector
              cycle: true

      - timing:
          - ON for 700ms to 5s
          - OFF for at least 250ms
        invalid_cooldown: 500ms
        then:
          - lambda: |-
              static const float LEVELS[] = {
                  0.05f,
                  0.10f,
                  0.20f,
                  0.40f,
                  0.70f,
                  1.00f,
              };

              id(brightness_step_index) =
                  (id(brightness_step_index) + 1) % 6;

              auto call = id(matrix).turn_on();
              call.set_brightness(LEVELS[id(brightness_step_index)]);
              call.perform();

      - timing:
          - ON for 40ms to 500ms
          - OFF for at least 500ms
        invalid_cooldown: 500ms
        then:
          - light.toggle:
              id: matrix
              transition_length: 0s

  - platform: status
    id: connection_status
    name: "Состояние подключения [CONNECTION]"
    entity_category: diagnostic

  - platform: analog_threshold
    id: sound_activity
    name: "Обнаружен звук [SOUND_ACTIVITY]"
    icon: "mdi:music-note"
    sensor_id: microphone_normalized
    threshold: 10.0
    filters:
      - delayed_off: 500ms

# ============================================================
# Матрица WS2812B 16x16.
#
# color_correct: 14% ограничивает расчётный максимум матрицы
# примерно до 2,15 А при полном белом поле:
# 256 x 60 mA x 0,14 ~= 2,15 A.
#
# Оставшийся запас нужен ESP32, MAX9814, TTP223 и самому БП.
# gamma_correct: 1.0 не обнуляет малые значения эффектов.
# ============================================================

light:
  - platform: esp32_rmt_led_strip
    id: matrix
    name: "Лампа 16x16 [MATRIX]"
    icon: "mdi:lava-lamp"

    pin: GPIO18
    num_leds: 256
    chipset: ws2812
    rgb_order: GRB

    color_correct:
      - 14%
      - 14%
      - 14%

    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF

    effects:
      - addressable_lambda:
          name: "Радуга"
          update_interval: 30ms
          lambda: |-
            static float phase = 0.0f;

            auto xy = [&](int x, int y) -> int {
              if (x < 0 || x >= 16 || y < 0 || y >= 16) {
                return -1;
              }

              int px = id(matrix_flip_x).state ? 15 - x : x;
              int py = id(matrix_flip_y).state ? 15 - y : y;

              if (id(matrix_swap_xy).state) {
                const int tmp = px;
                px = py;
                py = tmp;
              }

              if (id(matrix_serpentine).state && (py & 1)) {
                px = 15 - px;
              }

              return py * 16 + px;
            };

            if (initial_run) {
              phase = 0.0f;
              it.all() = Color::BLACK;
            }

            phase += 0.004f + id(effect_speed).state * 0.00020f;
            const float scale = 2.5f + id(effect_scale).state * 0.10f;

            for (int y = 0; y < 16; y++) {
              for (int x = 0; x < 16; x++) {
                const float hue =
                    phase + static_cast<float>(y) / scale +
                    static_cast<float>(x) / (scale * 2.0f);

                const uint8_t r = static_cast<uint8_t>(
                    127.5f + 127.5f * sinf(hue * 6.28318f));
                const uint8_t g = static_cast<uint8_t>(
                    127.5f + 127.5f * sinf(hue * 6.28318f + 2.094f));
                const uint8_t b = static_cast<uint8_t>(
                    127.5f + 127.5f * sinf(hue * 6.28318f + 4.188f));

                const int index = xy(x, y);
                if (index >= 0) {
                  it[index] = Color(r, g, b);
                }
              }
            }

      - addressable_random_twinkle:
          name: "Светлячки"
          twinkle_probability: 4%
          progress_interval: 24ms

      - addressable_fireworks:
          name: "Фейерверк"
          update_interval: 24ms
          spark_probability: 8%
          use_random_color: true
          fade_out_rate: 120

      - addressable_lambda:
          name: "Свеча"
          update_interval: 45ms
          lambda: |-
            static uint8_t flicker[256];
            static float phase = 0.0f;

            auto xy = [&](int x, int y) -> int {
              if (x < 0 || x >= 16 || y < 0 || y >= 16) {
                return -1;
              }

              int px = id(matrix_flip_x).state ? 15 - x : x;
              int py = id(matrix_flip_y).state ? 15 - y : y;

              if (id(matrix_swap_xy).state) {
                const int tmp = px;
                px = py;
                py = tmp;
              }

              if (id(matrix_serpentine).state && (py & 1)) {
                px = 15 - px;
              }

              return py * 16 + px;
            };

            if (initial_run) {
              phase = 0.0f;

              for (int i = 0; i < 256; i++) {
                flicker[i] = static_cast<uint8_t>(
                    150 + random_uint32() % 80);
              }

              it.all() = Color::BLACK;
            }

            phase += 0.015f + id(effect_speed).state * 0.00025f;

            float sound = id(microphone_normalized).state / 100.0f;
            if (isnan(sound) || !id(sound_overlay_enabled).state) {
              sound = 0.0f;
            }

            for (int y = 0; y < 16; y++) {
              for (int x = 0; x < 16; x++) {
                const int logical = y * 16 + x;
                const uint8_t target = static_cast<uint8_t>(
                    145 + random_uint32() % 100);

                flicker[logical] = static_cast<uint8_t>(
                    (static_cast<uint16_t>(flicker[logical]) * 3 +
                     target) /
                    4);

                const float vertical =
                    1.00f - static_cast<float>(y) * 0.018f;
                const float center =
                    1.00f - fabsf(static_cast<float>(x) - 7.5f) * 0.025f;
                const float wave =
                    0.88f + 0.12f *
                    sinf(phase * 6.28318f + x * 0.37f + y * 0.19f);
                const float audio_gain = 1.0f + sound * 0.20f;

                float level =
                    (static_cast<float>(flicker[logical]) / 255.0f) *
                    vertical * center * wave * audio_gain;

                if (level < 0.0f) {
                  level = 0.0f;
                } else if (level > 1.0f) {
                  level = 1.0f;
                }

                const uint8_t red =
                    static_cast<uint8_t>(255.0f * level);
                const uint8_t green =
                    static_cast<uint8_t>(
                        (75.0f + (random_uint32() % 75)) * level);
                const uint8_t blue =
                    static_cast<uint8_t>(
                        (random_uint32() % 8) * level);

                const int index = xy(x, y);
                if (index >= 0) {
                  it[index] = Color(red, green, blue);
                }
              }
            }

      - addressable_lambda:
          name: "Огонь 2D"
          update_interval: 35ms
          lambda: |-
            static uint8_t heat[256];

            auto xy = [&](int x, int y) -> int {
              if (x < 0 || x >= 16 || y < 0 || y >= 16) {
                return -1;
              }

              // Логические координаты:
              // x — слева направо;
              // y — снизу вверх.
              int px = id(matrix_flip_x).state ? 15 - x : x;
              int py = id(matrix_flip_y).state ? 15 - y : y;

              // На данной матрице группы по 16 LED идут колонками,
              // поэтому физические оси X/Y нужно поменять местами.
              if (id(matrix_swap_xy).state) {
                const int tmp = px;
                px = py;
                py = tmp;
              }

              if (id(matrix_serpentine).state && (py & 1)) {
                px = 15 - px;
              }

              return py * 16 + px;
            };

            if (initial_run) {
              memset(heat, 0, sizeof(heat));
              it.all() = Color::BLACK;
            }

            const int speed = static_cast<int>(id(effect_speed).state);
            const int scale = static_cast<int>(id(effect_scale).state);

            float sound = id(microphone_normalized).state / 100.0f;
            if (isnan(sound) || !id(sound_overlay_enabled).state) {
              sound = 0.0f;
            }

            const uint8_t cooling =
                static_cast<uint8_t>(8 + (100 - scale) / 5);

            for (int i = 0; i < 256; i++) {
              const uint8_t loss =
                  static_cast<uint8_t>(random_uint32() % (cooling + 1));
              heat[i] = heat[i] > loss ? heat[i] - loss : 0;
            }

            for (int x = 0; x < 16; x++) {
              for (int y = 15; y >= 2; y--) {
                heat[y * 16 + x] = static_cast<uint8_t>(
                    (static_cast<uint16_t>(heat[(y - 1) * 16 + x]) +
                     static_cast<uint16_t>(heat[(y - 2) * 16 + x]) +
                     static_cast<uint16_t>(heat[(y - 2) * 16 + x])) /
                    3);
              }
            }

            const uint32_t ignition_chance =
                static_cast<uint32_t>(25 + speed / 2 + sound * 80.0f);

            for (int x = 0; x < 16; x++) {
              if ((random_uint32() % 100) < ignition_chance) {
                heat[x] = static_cast<uint8_t>(
                    160 + (random_uint32() % 96));
              }
            }

            for (int y = 0; y < 16; y++) {
              for (int x = 0; x < 16; x++) {
                const uint8_t t = heat[y * 16 + x];

                uint8_t r = 0;
                uint8_t g = 0;
                uint8_t b = 0;

                if (t < 85) {
                  r = static_cast<uint8_t>(t * 3);
                } else if (t < 170) {
                  r = 255;
                  g = static_cast<uint8_t>((t - 85) * 3);
                } else {
                  r = 255;
                  g = 255;
                  b = static_cast<uint8_t>((t - 170) * 3);
                }

                const int index = xy(x, y);
                if (index >= 0) {
                  it[index] = Color(r, g, b);
                }
              }
            }

      - addressable_lambda:
          name: "Цифровой дождь"
          update_interval: 45ms
          lambda: |-
            static int16_t heads[16];
            static uint8_t lengths[16];
            static uint8_t tick = 0;

            auto xy = [&](int x, int y) -> int {
              if (x < 0 || x >= 16 || y < 0 || y >= 16) {
                return -1;
              }

              // Логические координаты:
              // x — слева направо;
              // y — снизу вверх.
              int px = id(matrix_flip_x).state ? 15 - x : x;
              int py = id(matrix_flip_y).state ? 15 - y : y;

              // На данной матрице группы по 16 LED идут колонками,
              // поэтому физические оси X/Y нужно поменять местами.
              if (id(matrix_swap_xy).state) {
                const int tmp = px;
                px = py;
                py = tmp;
              }

              if (id(matrix_serpentine).state && (py & 1)) {
                px = 15 - px;
              }

              return py * 16 + px;
            };

            if (initial_run) {
              it.all() = Color::BLACK;

              for (int x = 0; x < 16; x++) {
                heads[x] = 15 + static_cast<int>(random_uint32() % 24);
                lengths[x] =
                    static_cast<uint8_t>(3 + random_uint32() % 8);
              }
            }

            it.all().fade_to_black(45);

            const uint8_t divider =
                static_cast<uint8_t>(1 + (100 - id(effect_speed).state) / 20);

            tick++;
            if (tick < divider) {
              return;
            }
            tick = 0;

            for (int x = 0; x < 16; x++) {
              heads[x]--;

              if (heads[x] < -static_cast<int>(lengths[x])) {
                heads[x] = 15 + static_cast<int>(random_uint32() % 20);
                lengths[x] =
                    static_cast<uint8_t>(3 + random_uint32() % 8);
              }

              for (int trail = 0; trail < lengths[x]; trail++) {
                const int y = heads[x] + trail;

                if (y < 0 || y >= 16) {
                  continue;
                }

                const int index = xy(x, y);
                if (index < 0) {
                  continue;
                }

                if (trail == 0) {
                  it[index] = Color(180, 255, 180);
                } else {
                  const uint8_t green = static_cast<uint8_t>(
                      220 - (trail * 180 / lengths[x]));
                  it[index] = Color(0, green, 0);
                }
              }
            }

      - addressable_lambda:
          name: "Плазма"
          update_interval: 30ms
          lambda: |-
            static float phase = 0.0f;
            static float smoothed_sound = 0.0f;

            auto xy = [&](int x, int y) -> int {
              if (x < 0 || x >= 16 || y < 0 || y >= 16) {
                return -1;
              }

              // Логические координаты:
              // x — слева направо;
              // y — снизу вверх.
              int px = id(matrix_flip_x).state ? 15 - x : x;
              int py = id(matrix_flip_y).state ? 15 - y : y;

              // На данной матрице группы по 16 LED идут колонками,
              // поэтому физические оси X/Y нужно поменять местами.
              if (id(matrix_swap_xy).state) {
                const int tmp = px;
                px = py;
                py = tmp;
              }

              if (id(matrix_serpentine).state && (py & 1)) {
                px = 15 - px;
              }

              return py * 16 + px;
            };

            if (initial_run) {
              phase = 0.0f;
              smoothed_sound = 0.0f;
              it.all() = Color::BLACK;
            }

            float sound = id(microphone_normalized).state / 100.0f;
            if (isnan(sound) || !id(sound_overlay_enabled).state) {
              sound = 0.0f;
            }

            const float smoothing = id(microphone_smoothing).state;
            smoothed_sound =
                smoothed_sound * smoothing + sound * (1.0f - smoothing);

            const float speed =
                0.02f + id(effect_speed).state * 0.0015f;
            const float scale =
                2.0f + id(effect_scale).state * 0.08f;

            phase += speed * (1.0f + smoothed_sound * 2.0f);

            for (int y = 0; y < 16; y++) {
              for (int x = 0; x < 16; x++) {
                const float value =
                    sinf((x + phase * 18.0f) / scale) +
                    sinf((y - phase * 14.0f) / (scale * 0.85f)) +
                    sinf((x + y + phase * 10.0f) / (scale * 1.25f));

                const float normalized = (value + 3.0f) / 6.0f;

                const uint8_t r = static_cast<uint8_t>(
                    127.5f + 127.5f * sinf(normalized * 6.28318f));
                const uint8_t g = static_cast<uint8_t>(
                    127.5f + 127.5f * sinf(normalized * 6.28318f + 2.094f));
                const uint8_t b = static_cast<uint8_t>(
                    127.5f + 127.5f * sinf(normalized * 6.28318f + 4.188f));

                const float gain = 0.35f + smoothed_sound * 0.65f;

                const int index = xy(x, y);
                if (index >= 0) {
                  it[index] = Color(
                      static_cast<uint8_t>(r * gain),
                      static_cast<uint8_t>(g * gain),
                      static_cast<uint8_t>(b * gain));
                }
              }
            }

      - addressable_lambda:
          name: "Цветомузыка — пульс"
          update_interval: 25ms
          lambda: |-
            static float envelope = 0.0f;
            static float hue_phase = 0.0f;

            if (initial_run) {
              envelope = 0.0f;
              hue_phase = 0.0f;
              it.all() = Color::BLACK;
            }

            float target = id(microphone_normalized).state / 100.0f;
            if (isnan(target)) {
              target = 0.0f;
            }

            const float smoothing = id(microphone_smoothing).state;

            if (target > envelope) {
              envelope = target;
            } else {
              envelope =
                  envelope * smoothing + target * (1.0f - smoothing);
            }

            hue_phase +=
                0.005f + id(effect_speed).state * 0.00025f;

            const uint8_t r = static_cast<uint8_t>(
                (127.5f + 127.5f * sinf(hue_phase * 6.28318f)) *
                envelope);
            const uint8_t g = static_cast<uint8_t>(
                (127.5f + 127.5f * sinf(hue_phase * 6.28318f + 2.094f)) *
                envelope);
            const uint8_t b = static_cast<uint8_t>(
                (127.5f + 127.5f * sinf(hue_phase * 6.28318f + 4.188f)) *
                envelope);

            it.all() = Color(r, g, b);

      - addressable_lambda:
          name: "Цветомузыка — VU"
          update_interval: 30ms
          lambda: |-
            static float envelope = 0.0f;

            auto xy = [&](int x, int y) -> int {
              if (x < 0 || x >= 16 || y < 0 || y >= 16) {
                return -1;
              }

              // Логические координаты:
              // x — слева направо;
              // y — снизу вверх.
              int px = id(matrix_flip_x).state ? 15 - x : x;
              int py = id(matrix_flip_y).state ? 15 - y : y;

              // На данной матрице группы по 16 LED идут колонками,
              // поэтому физические оси X/Y нужно поменять местами.
              if (id(matrix_swap_xy).state) {
                const int tmp = px;
                px = py;
                py = tmp;
              }

              if (id(matrix_serpentine).state && (py & 1)) {
                px = 15 - px;
              }

              return py * 16 + px;
            };

            if (initial_run) {
              envelope = 0.0f;
              it.all() = Color::BLACK;
            }

            float target = id(microphone_normalized).state / 100.0f;
            if (isnan(target)) {
              target = 0.0f;
            }

            const float smoothing = id(microphone_smoothing).state;

            if (target > envelope) {
              envelope = target;
            } else {
              envelope =
                  envelope * smoothing + target * (1.0f - smoothing);
            }

            int height = static_cast<int>(envelope * 16.0f + 0.5f);
            if (height < 0) {
              height = 0;
            } else if (height > 16) {
              height = 16;
            }

            it.all().fade_to_black(80);

            for (int x = 0; x < 16; x++) {
              for (int y = 0; y < height; y++) {
                const int index = xy(x, y);
                if (index < 0) {
                  continue;
                }

                if (y < 9) {
                  it[index] = Color(0, 255, 0);
                } else if (y < 13) {
                  it[index] = Color(255, 180, 0);
                } else {
                  it[index] = Color(255, 0, 0);
                }
              }
            }

      - addressable_lambda:
          name: "Цветомузыка — центр"
          update_interval: 30ms
          lambda: |-
            static float envelope = 0.0f;
            static float phase = 0.0f;

            auto xy = [&](int x, int y) -> int {
              if (x < 0 || x >= 16 || y < 0 || y >= 16) {
                return -1;
              }

              // Логические координаты:
              // x — слева направо;
              // y — снизу вверх.
              int px = id(matrix_flip_x).state ? 15 - x : x;
              int py = id(matrix_flip_y).state ? 15 - y : y;

              // На данной матрице группы по 16 LED идут колонками,
              // поэтому физические оси X/Y нужно поменять местами.
              if (id(matrix_swap_xy).state) {
                const int tmp = px;
                px = py;
                py = tmp;
              }

              if (id(matrix_serpentine).state && (py & 1)) {
                px = 15 - px;
              }

              return py * 16 + px;
            };

            if (initial_run) {
              envelope = 0.0f;
              phase = 0.0f;
              it.all() = Color::BLACK;
            }

            float target = id(microphone_normalized).state / 100.0f;
            if (isnan(target)) {
              target = 0.0f;
            }

            const float smoothing = id(microphone_smoothing).state;

            if (target > envelope) {
              envelope = target;
            } else {
              envelope =
                  envelope * smoothing + target * (1.0f - smoothing);
            }

            phase += 0.02f + id(effect_speed).state * 0.0008f;
            it.all().fade_to_black(70);

            const float radius = envelope * 10.5f;

            for (int y = 0; y < 16; y++) {
              for (int x = 0; x < 16; x++) {
                const float dx = x - 7.5f;
                const float dy = y - 7.5f;
                const float distance = sqrtf(dx * dx + dy * dy);
                const float delta = fabsf(distance - radius);

                if (delta > 1.2f) {
                  continue;
                }

                const float intensity =
                    (1.2f - delta) / 1.2f * envelope;

                const uint8_t r = static_cast<uint8_t>(
                    (127.5f + 127.5f * sinf(phase * 6.28318f)) *
                    intensity);
                const uint8_t g = static_cast<uint8_t>(
                    (127.5f + 127.5f * sinf(phase * 6.28318f + 2.094f)) *
                    intensity);
                const uint8_t b = static_cast<uint8_t>(
                    (127.5f + 127.5f * sinf(phase * 6.28318f + 4.188f)) *
                    intensity);

                const int index = xy(x, y);
                if (index >= 0) {
                  it[index] = Color(r, g, b);
                }
              }
            }

# ============================================================
# Управляющие кнопки Home Assistant / web_server.
# Кнопки next/previous меняют effect_selector, поэтому список
# эффекта остаётся синхронизирован с аппаратным управлением.
# ============================================================

button:
  - platform: template
    id: next_effect
    name: "Следующий эффект [NEXT_FX]"
    icon: "mdi:skip-next"
    on_press:
      then:
        - select.next:
            id: effect_selector
            cycle: true

  - platform: template
    id: previous_effect
    name: "Предыдущий эффект [PREV_FX]"
    icon: "mdi:skip-previous"
    on_press:
      then:
        - select.previous:
            id: effect_selector
            cycle: true

  - platform: template
    id: calibrate_microphone
    name: "Калибровать шумовой порог [CAL_MIC]"
    icon: "mdi:microphone-settings"
    on_press:
      then:
        - number.set:
            id: microphone_noise_floor
            value: !lambda |-
              float level = id(microphone_level).state;

              if (isnan(level)) {
                return 0.45f;
              }

              level += 0.02f;

              if (level < 0.0f) {
                level = 0.0f;
              } else if (level > 1.5f) {
                level = 1.5f;
              }

              return level;

  - platform: template
    id: matrix_off
    name: "Выключить лампу [OFF]"
    icon: "mdi:lightbulb-off"
    on_press:
      then:
        - light.turn_off:
            id: matrix
            transition_length: 0s

  - platform: restart
    id: restart_a5in_led_block
    name: "Перезагрузить a5in-led-block [RESTART]"
    icon: "mdi:restart"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      id: device_ip_address
      name: "IP-адрес [IP]"
      icon: "mdi:ip-network"
      entity_category: diagnostic

    ssid:
      id: connected_wifi_ssid
      name: "Подключённая сеть [SSID]"
      icon: "mdi:wifi"
      entity_category: diagnostic

    mac_address:
      id: device_wifi_mac
      name: "Wi-Fi MAC [MAC]"
      icon: "mdi:network-outline"
      entity_category: diagnostic

  - platform: version
    id: esphome_version
    name: "Версия ESPHome [VERSION]"
    entity_category: diagnostic
